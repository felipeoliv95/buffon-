<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffon: Visual e Espaço de Fases</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f7f6; 
            padding: 20px; 
            text-align: center; 
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            display: inline-block; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 95%; 
            max-width: 950px; 
        }
        .grid-sim { 
            display: grid; 
            grid-template-columns: 1.2fr 1fr; 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        canvas { 
            background-color: #fff; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            width: 100%;
            height: auto;
        }
        .controls { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #e9ecef; 
            margin-bottom: 20px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }
        .slider-group { text-align: left; }
        label { 
            font-weight: bold; 
            color: #495057; 
            display: block; 
            margin-bottom: 8px; 
        }
        input[type="range"] { width: 100%; cursor: pointer; }
        .status-container { margin-top: 10px; }
        .status { 
            font-weight: bold; 
            padding: 15px; 
            border-radius: 8px; 
            text-transform: uppercase; 
            font-size: 1.4em; 
        }
        .hit { background: #fa5252; color: white; }
        .miss { background: #40c057; color: white; }

        @media (max-width: 800px) {
            .grid-sim, .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Visual da Agulha vs Gráfico</h2>
    <p>O ponto no gráfico representa a combinação de <b>Ângulo (&theta;)</b> e <b>Distância (D)</b> da agulha.</p>

    <div class="grid-sim">
        <div>
            <label>Visão Geométrica da Agulha</label>
            <canvas id="needleCanvas" width="500" height="350"></canvas>
        </div>
        <div>
            <label> Visão do Gráfico (Mapa D vs &theta;)</label>
            <canvas id="graphCanvas" width="400" height="350"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="slider-group">
            <label>Posição Vertical do Centro (Y): <span id="y-txt">0.43</span></label>
            <input type="range" id="ySlider" min="0" max="1" step="0.01" value="0.43">
        </div>
        <div class="slider-group">
            <label>Ângulo da Agulha (&theta;): <span id="a-txt">42</span>&deg;</label>
            <input type="range" id="aSlider" min="0" max="180" value="42">
        </div>
    </div>

    <div class="status-container">
        <div id="status-msg" class="status miss">Não Cortou</div>
    </div>
</div>

<script>
    // Usamos o window.onload para garantir que as imagens apareçam assim que a página abrir
    window.onload = function() {
        const nCanvas = document.getElementById('needleCanvas');
        const gCanvas = document.getElementById('graphCanvas');
        const nCtx = nCanvas.getContext('2d');
        const gCtx = gCanvas.getContext('2d');
        const ySlider = document.getElementById('ySlider');
        const aSlider = document.getElementById('aSlider');

        const L_needle = 250; 
        const DIST_lines = 250; 
        const margin = 50;
        const lineTop = margin;
        const lineBot = margin + DIST_lines;

        function draw() {
            const yPerc = parseFloat(ySlider.value);
            const thetaDeg = parseInt(aSlider.value);
            const thetaRad = (thetaDeg * Math.PI) / 180;
            
            const isUpperRef = yPerc <= 0.5;
            const D = isUpperRef ? yPerc : 1 - yPerc;
            const refY = isUpperRef ? lineTop : lineBot;
            const limit = 0.5 * Math.sin(thetaRad);
            const cruzou = D <= limit + 0.001;

            document.getElementById('a-txt').innerText = thetaDeg;
            document.getElementById('y-txt').innerText = yPerc.toFixed(2);
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = cruzou ? "Cortou!" : "Não Cortou";
            statusMsg.className = cruzou ? "status hit" : "status miss";

            // --- DESENHAR AGULHA ---
            nCtx.clearRect(0, 0, 500, 350);
            nCtx.fillStyle = "#f8f9fa";
            nCtx.fillRect(0, 0, 500, 350);
            
            nCtx.lineWidth = 4;
            nCtx.strokeStyle = "#333";
            nCtx.beginPath();
            nCtx.moveTo(20, lineTop); nCtx.lineTo(480, lineTop);
            nCtx.moveTo(20, lineBot); nCtx.lineTo(480, lineBot);
            nCtx.stroke();

            const cX = 250, cY = lineTop + (yPerc * DIST_lines);
            const xStart = cX - (L_needle/2) * Math.cos(thetaRad);
            const yStart = cY + (L_needle/2) * Math.sin(thetaRad); 
            const xEnd = cX + (L_needle/2) * Math.cos(thetaRad);
            const yEnd = cY - (L_needle/2) * Math.sin(thetaRad);

            nCtx.lineWidth = 10;
            nCtx.lineCap = "round";
            nCtx.strokeStyle = cruzou ? "#fa5252" : "#40c057";
            nCtx.beginPath(); nCtx.moveTo(xStart, yStart); nCtx.lineTo(xEnd, yEnd); nCtx.stroke();

            nCtx.fillStyle = "#000000";
            nCtx.beginPath(); nCtx.arc(cX, cY, 6, 0, Math.PI * 2); nCtx.fill();

            drawArrow(nCtx, cX - 100, cY, cX - 100, refY, isUpperRef ? "#339af0" : "#ae3ec9");

            // --- DESENHAR GRÁFICO ---
            gCtx.clearRect(0, 0, 400, 350);
            const pad = 40, gW = 320, gH = 250, baseline = 300;
            
            gCtx.fillStyle = "#339af0";
            gCtx.beginPath();
            gCtx.moveTo(pad, baseline);
            for(let x=0; x<=gW; x++) {
                let t = (x/gW) * Math.PI;
                let y = Math.sin(t) * gH; 
                gCtx.lineTo(pad + x, baseline - y);
            }
            gCtx.lineTo(pad + gW, baseline);
            gCtx.fill();

            gCtx.strokeStyle = "#ccc";
            gCtx.setLineDash([5, 5]);
            gCtx.strokeRect(pad, baseline - gH, gW, gH);
            gCtx.setLineDash([]);
            gCtx.strokeStyle = "#000"; gCtx.lineWidth = 2;
            gCtx.beginPath(); gCtx.moveTo(pad, 30); gCtx.lineTo(pad, baseline); gCtx.lineTo(pad+gW+20, baseline); gCtx.stroke();
            
            const pX = pad + (thetaDeg / 180) * gW;
            const pY = baseline - (D / 0.5) * gH;
            gCtx.fillStyle = cruzou ? "#fa5252" : "#40c057";
            gCtx.beginPath(); gCtx.arc(pX, pY, 8, 0, Math.PI * 2); gCtx.fill();
            gCtx.strokeStyle = "#000"; gCtx.lineWidth = 2; gCtx.stroke();

            gCtx.fillStyle = "#000"; gCtx.font = "bold 14px Arial";
            gCtx.fillText("0", pad-10, baseline+20);
            gCtx.fillText("π", pad+gW-5, baseline+20);
            gCtx.fillText("1/2", pad-30, baseline-gH+5);
            gCtx.fillText("θ", pad+gW+15, baseline+20);
            gCtx.fillText("D", pad-25, 30);
        }

        function drawArrow(ctx, x1, y1, x2, y2, color) {
            const head = 10;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - head * Math.cos(angle - Math.PI/6), y2 - head * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x2 - head * Math.cos(angle + Math.PI/6), y2 - head * Math.sin(angle + Math.PI/6));
            ctx.stroke();
        }

        ySlider.oninput = draw;
        aSlider.oninput = draw;
        draw(); // Chama o desenho pela primeira vez
    };
</script>

</body>
</html>
